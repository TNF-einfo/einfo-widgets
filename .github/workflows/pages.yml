# Deploy GitHub Pages through Actions (2026-11-26), replacing the branch build.
# Why: the branch build has a soft limit of 10 builds per hour; election night pushes every few minutes.
# No Jekyll since 2026-11-27: the files are uploaded as they are, which saves about 15 s per deploy (image pull + build).
# Folder READMEs no longer render as pages; every map, data and script file is served byte for byte as before.
# Roll back: put the jekyll-build-pages step back (source ./, destination ./_site) and drop "path: ." from the upload.
name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read   # deploy-pages lists this run's artifacts; without it the list came back empty (11-26)
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
# Two jobs: in one job, deploy-pages sometimes listed the artifact before it was finalised and found none
# (11-26, intermittent even with actions: read). A separate deploy job starts only after the upload job ends.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .   # hidden files (.git, .github, .gitignore) stay out by default
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

<!doctype html>
<!-- build_map.py 的模板：{{…}} 由產生器填入，不要直接改產出的 election-2026.html -->
<html lang="zh-Hant-TW" data-theme="{{THEME}}" class="{{VARIANT}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}｜環境資訊中心</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 字體照環資官網：思源黑體 Noto Sans TC，text= 只載這頁用到的字（build_map.py 收集） -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap&text={{FONT_TEXT}}">
<style>
  /* 兩套主題，build_map.py --theme 決定 <html data-theme>（SPEC「配色」）。政黨色都在各自的 --sea 上用 validate_palette.js 驗過；
     -hi 是浮起時打亮的板面（OKLCH 亮度 +0.06／+0.07）；--shade-* 是板子底下的影子，三層半透明疊出柔邊（不用濾鏡） */
  :root[data-theme="paper"]{
    --frame:#ffffff; --mast:#ffffff; --mast-ink:#232333; --sea:#f2f3f1; --inset:#e6e8e5; --line:#ffffff; --sel:#ffffff;
    --kmt:#4170e9; --dpp:#218b30; --tpp:#26c0cf; --oth:#7d838b; --pend:#e3e6e9; --pend-line:#b5bcc5;
    --kmt-hi:#5283fe; --dpp-hi:#399e43; --tpp-hi:#45d4e3; --oth-hi:#8f959d; --pend-hi:#f7fafd; --pend-line-hi:#c8cfd8;
    --shade-a:rgba(26,35,50,.18); --shade-b:rgba(26,35,50,.10); --shade-c:rgba(26,35,50,.05); --frame-rgb:255,255,255;
    --card:#ffffff; --card-shadow:0 6px 20px rgba(26,35,50,.14), 0 1px 3px rgba(26,35,50,.12);
    --ink:#232333; --body:#373740; --mute:#6e6e71; --rule:rgba(26,35,50,.12); --btn:#eef0f2; --btn-2:#e4e7eb; --btn-3:#d9dde2; --accent:#dd8346;
    --chip:#eef0f2; --tag-y:#fbefc4; --tag-g:#dcefd8; --tag-p:#f9dde4; --tag-b:#dbe7f8;   /* 標籤淡底配 --body 字，對比 9.3 到 10.2:1 */
  }
  :root[data-theme="night"]{
    --frame:#141b27; --mast:#141b27; --mast-ink:#f4f6f8; --sea:#1a2332; --inset:#222d3f; --line:#1a2332; --sel:#ffffff;
    --kmt:#3567de; --dpp:#0b8932; --tpp:#12a5b1; --oth:#b8bdc4; --pend:#263041; --pend-line:#55637b;
    --kmt-hi:#497df6; --dpp-hi:#309f47; --tpp-hi:#3abbc7; --oth-hi:#ced3db; --pend-hi:#384254; --pend-line-hi:#697790;
    --shade-a:rgba(5,8,13,.42); --shade-b:rgba(5,8,13,.24); --shade-c:rgba(5,8,13,.12); --frame-rgb:20,27,39;
    --card:#2d3748; --card-shadow:0 12px 32px rgba(5,8,13,.5), 0 1px 3px rgba(5,8,13,.35);
    --ink:#f4f6f8; --body:#e2e6eb; --mute:#a9b4c2; --rule:rgba(255,255,255,.12); --btn:#2d3748; --btn-2:#364257; --btn-3:#3e4b61; --accent:#dd8346;
    --chip:#3e4b61; --tag-y:#4a4122; --tag-g:#244336; --tag-p:#4f2c3a; --tag-b:#26405f;   /* 深底的標籤：深色底配 --body 淺字，對比 8.1 到 9.6:1 */
  }
  /* 徽章底色兩套主題共用：同色相壓深到白字 4.5:1 以上（國 5.47、民 5.10、眾 5.09、無 6.33） */
  :root{ --ease-out:cubic-bezier(0.23,1,0.32,1); --kmt-badge:#2f62d6; --dpp-badge:#1a7f2b; --tpp-badge:#007a86; --oth-badge:#5b6068 }
  html{ -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100% }
  html,body{ margin:0; height:100%; background:var(--frame); overflow:hidden }
  body{ font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; color:var(--ink) }
  .frame{ position:relative; width:100%; height:100%; overflow:hidden; background:var(--frame) }   /* 100vh 在 iPhone Safari 是工具列收起的高度，另開文章版時底部會被蓋住（11-27） */
  /* 地圖只畫在標題與出處之間這塊板子裡，上下是直切的邊、不做漸層（top／bottom 由 layout() 量）；
     傾斜時地圖頂端往後倒，SVG 比框大一圈（大小與 transform-origin 也由 layout() 量），邊角才不會露底 */
  .mapwin{ position:absolute; left:0; right:0; top:0; bottom:0; overflow:hidden; background:var(--sea) }
  /* 觸控：直向捲動交給瀏覽器，橫向與捏由 JS 處理（縣市、小地圖的 manipulation 跟這裡取交集，也只剩 pan-y） */
  .mapwin, .isles{ touch-action:pan-y }
  #map{ position:absolute; width:100%; height:100%; display:block }
  /* 縣市的洞（新北包臺北、嘉義縣包嘉義市）靠 evenodd；線寬不跟著縮放 */
  #map path, .isle path{ fill-rule:evenodd; vector-effect:non-scaling-stroke }
  .g-kmt{ fill:var(--kmt); background:var(--kmt) } .g-dpp{ fill:var(--dpp); background:var(--dpp) }
  .g-tpp{ fill:var(--tpp); background:var(--tpp) } .g-oth{ fill:var(--oth); background:var(--oth) }
  .g-pend{ fill:url(#hatch); background:repeating-linear-gradient(-45deg,var(--pend-line) 0 1.2px,var(--pend) 1.2px 4px) }
  .hp{ fill:var(--pend) } .hl{ fill:var(--pend-line) } #hatchH .hp{ fill:var(--pend-hi) } #hatchH .hl{ fill:var(--pend-line-hi) }
  /* 點到的離島小地圖：打亮並浮起（11-18），不畫白邊（離島都不要白框；鍵盤焦點照樣畫）。
     小地圖的 SVG 單位不是螢幕 px：抬高與影子的長度由 layout() 照小地圖的縮放算好，放在 --lf-t、--lf-f */
  .isle.on .g-kmt{ fill:var(--kmt-hi) } .isle.on .g-dpp{ fill:var(--dpp-hi) } .isle.on .g-tpp{ fill:var(--tpp-hi) } .isle.on .g-oth{ fill:var(--oth-hi) }
  .isle .lf{ transition:transform .25s var(--ease-out) }
  .isle.on .lf{ transform:var(--lf-t) }
  /* 影子只有一條灰：原位一塊半透明的島，板面抬高後在下緣露出來（11-18 定，澎湖也一樣）。
     不用 CSS 濾鏡（WebKit 不畫 SVG 元素上的 drop-shadow），也不加寬描邊（小島會被撐成一顆顆灰點） */
  .isle .sd{ display:none } .isle.on .sd{ display:inline; fill:rgba(26,35,50,.28) }
  @media (prefers-reduced-motion:reduce){ .isle .lf{ transition:none } .isle.on .lf{ transform:none } .isle.on .sd{ display:none } }
  .isle path{ stroke:none } .isle.focus path{ stroke:var(--sel); stroke-width:2; stroke-linejoin:round }
  .cty{ cursor:pointer; outline:none; touch-action:manipulation }
  .cty path{ stroke:var(--line); stroke-width:1; stroke-linejoin:round } .cty path.isl{ stroke:none }
  .hit{ fill:none; pointer-events:all; cursor:pointer; touch-action:manipulation }
  /* 浮起的板子是複製過來的 <path>（不用 <use>：WebKit 會把原路徑的 .cty path 樣式帶進 <use> 的複本，畫出深色雙邊）；
     影子不用模糊濾鏡，只用兩層平的色塊：原位的側面、再往下錯開的半透明接觸影 */
  #lift{ pointer-events:none } #lc{ stroke:none } #cv{ stroke-width:1.5px; stroke-linejoin:round }
  #sk{ fill:var(--shade-a); stroke:var(--shade-b); stroke-width:6px; stroke-linejoin:round }
  #sh{ fill:var(--shade-c); stroke:var(--shade-c); stroke-width:14px; stroke-linejoin:round }
  #lift.isl #sk{ fill:rgba(26,35,50,.28); stroke:none }   /* 澎湖：只留原位一條灰影（JS 也把 sh 關掉） */
  #ol,#fo{ fill:none; stroke:var(--sel); stroke-width:2; stroke-linejoin:round; pointer-events:none }

  /* 上緣漸層：地圖從標題底下淡出（第二版的做法，11-17 加回來）。下緣不加漸層也不墊底色（11-17 定），
     出處直接壓在地圖上，靠同海面色的字暈讀得到 */
  /* 漸層 40px、兩端放慢（smoothstep 取樣），實心接漸層的地方才不會看到一條線；40 要跟 layout() 的 FADE 一樣 */
  header{ position:absolute; left:0; right:0; top:0; z-index:3; pointer-events:none; padding-bottom:40px;
    background:linear-gradient(rgb(var(--frame-rgb)) calc(100% - 40px), rgba(var(--frame-rgb),.97) calc(100% - 34px),
      rgba(var(--frame-rgb),.87) calc(100% - 27px), rgba(var(--frame-rgb),.68) calc(100% - 20px), rgba(var(--frame-rgb),.43) calc(100% - 13px),
      rgba(var(--frame-rgb),.18) calc(100% - 6px), rgba(var(--frame-rgb),0)) }
  .ttl{ display:flex; align-items:center; gap:8px; margin:0; padding:9px 12px; background:var(--mast); color:var(--mast-ink) }
  .ttl img{ height:18px; width:auto; flex:none; margin-left:auto }   /* logo 靠右 */
  /* 標題照官網段落標題 h2：黑體、字重 900，字級跟著框寬縮放；352.8 寬時約 21px，加上靠右的 logo 剛好一行 */
  h1{ margin:0; font-weight:900; font-size:clamp(20px, 6vw, 28px); line-height:1.25 } h1 span{ display:inline-block }
  .legend{ display:flex; flex-wrap:wrap; gap:4px 12px; list-style:none; margin:0; padding:7px 12px 8px; font-size:13px }
  .legend li{ display:flex; align-items:center; gap:5px }
  .sw{ display:inline-block; width:10px; height:10px; flex:none; border-radius:2px }

  .isles{ position:absolute; left:12px; top:80px; z-index:2; display:flex; flex-direction:column; gap:8px; transition:none }
  .isle{ width:100px; cursor:pointer; outline:none; touch-action:manipulation }
  .isle svg{ display:block; width:100px; height:88px; background:var(--inset); border-radius:6px }
  .isle[data-code="09020"] svg{ height:54px }
  .isle span{ display:block; margin-top:3px; font-size:11px; line-height:1.2; color:var(--mute); text-align:center }

  .cardpos{ position:absolute; left:4%; right:4%; bottom:44px; z-index:4; pointer-events:none }
  /* 卡片浮在地圖板子上：淺色主題白卡、深色主題比海面淺一階；圓角 8px，跟小地圖底塊、按鈕同一組 */
  .card{ pointer-events:auto; box-sizing:border-box; max-height:45vh; overflow:auto; overscroll-behavior:auto;   /* 卡片捲到底就接著捲文章；contain 會讓手指在卡片上直滑時整頁卡住（11-17） */
    background:var(--card); border-radius:8px; padding:12px 14px 13px; outline:none; box-shadow:var(--card-shadow) }
  .card.measure{ position:absolute; left:0; right:0; bottom:0; visibility:hidden }
  .card h2{ margin:0; font-size:17px; line-height:1.3 }
  .card .st{ margin:2px 0 0; font-size:13px; color:var(--mute) }
  .card ol{ list-style:none; margin:9px 0 0; padding:0 }
  .card li{ display:grid; grid-template-columns:20px minmax(0,1fr) auto 4.4em; column-gap:8px; align-items:baseline; font-size:14px; line-height:1.45 }
  .card li + li{ margin-top:6px }
  /* 政黨徽章：政黨色圓角方塊配白色粗體單字，白字對底色都過 4.5:1（SPEC「配色」）；旁邊照樣寫政黨名稱 */
  .bd{ align-self:start; display:grid; place-items:center; width:20px; height:20px; border-radius:5px; color:#fff;
    font-style:normal; font-weight:800; font-size:12.5px; line-height:1; user-select:none; -webkit-user-select:none }
  .b-kmt{ background:var(--kmt-badge) } .b-dpp{ background:var(--dpp-badge) } .b-tpp{ background:var(--tpp-badge) } .b-oth{ background:var(--oth-badge) }
  .card .nm b{ font-weight:500 } .card li.win .nm b{ font-weight:700 }
  /* 當選：圈選章（圓圈裡一個「卜」），用官網的橘，不用綠（綠是民進黨）；大小跟姓名字高相近，報讀器照念「當選」 */
  /* 圈選章：印泥紅，「卜」的兩筆都碰到圓圈，照投票用的章（11-26） */
  .stamp{ display:inline-block; width:1.3em; height:1.3em; margin-left:5px; vertical-align:-.3em; color:#d4332b }
  [data-theme="night"] .stamp{ color:#ff6b5e }
  .stamp *{ fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:butt }
  .card .v, .card .pc{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--body) }
  .card .note{ margin:7px 0 0; font-size:12px; color:var(--mute) }
  /* 開票中標示：中性色小藥丸加一顆不動的圓點 */
  .live{ display:inline-flex; align-items:center; gap:5px; margin-left:8px; padding:1px 8px 1px 7px; border-radius:999px; background:var(--chip); color:var(--body);
    font-size:12px; font-weight:500; line-height:1.5; vertical-align:2px; white-space:nowrap }
  .live i{ width:6px; height:6px; border-radius:50%; background:currentColor; flex:none }
  /* 當選人的標籤：藥丸、不加框線，「環境政見：」靠黨徽對齊（第一欄起，11-26 改），放不下就換行 */
  .card .tg{ grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:4px; margin-top:5px }
  .tag{ font-size:12px; line-height:1.35; padding:2px 9px; border-radius:999px; color:var(--body); overflow-wrap:anywhere }
  /* 標籤前的「環境政見：」：跟標籤同字級與上下內距，文字基線才對齊；用次要文字色（paper 對白卡 5.1:1） */
  .tgl{ font-size:12px; line-height:1.35; padding:2px 0; color:var(--mute); white-space:nowrap }
  .t-y{ background:var(--tag-y) } .t-g{ background:var(--tag-g) } .t-p{ background:var(--tag-p) } .t-b{ background:var(--tag-b) }

  footer{ position:absolute; left:0; right:0; bottom:0; z-index:5; display:flex; align-items:flex-end; justify-content:space-between; gap:8px;
    padding:4px 10px 6px 12px; font-size:11px; color:var(--mute); background:none; pointer-events:none }   /* 疊在地圖上：點擊穿過去給地圖（11-27：拉近臺中時點不到彰化、南投） */
  footer button, footer a{ pointer-events:auto }   /* 只有按鈕與連結接點擊，按鈕之間的空隙也穿過去 */
  @media (max-width:620px){ footer{ font-size:9px } }   /* 出處字：電腦版 11px、手機與平板 9px（11-27） */
  .src{ margin:0; line-height:1.3; min-width:0; text-shadow:0 0 2px var(--sea), 0 0 4px var(--sea), 0 0 6px var(--sea) } .src span{ display:inline-block } .src a{ color:inherit } .src i{ font-style:normal; white-space:nowrap }
  .btns{ display:flex; gap:4px; flex:none }
  button{ font:inherit; font-size:12px; color:var(--ink); background:var(--btn); border:0; border-radius:999px; padding:0 11px; min-height:32px; cursor:pointer;
    touch-action:manipulation; user-select:none; -webkit-user-select:none; transition:transform 120ms var(--ease-out), background-color 120ms ease }
  button:active{ transform:scale(.97); background:var(--btn-3) }
  /* 文章版的按鈕疊在地圖上（11-27 頁尾改成疊在地圖左下角）：淺灰按鈕跟海面幾乎同色，改白底加一圈淡影子 */
  html:not(.home) footer button{ background:var(--card); box-shadow:0 1px 3px rgba(26,35,50,.18), 0 0 0 1px rgba(26,35,50,.06) }
  html:not(.home) footer button:active{ background:var(--btn-2) }
  #home[aria-hidden="true"]{ visibility:hidden }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap }
  :focus-visible{ outline:2px solid var(--sel); outline-offset:2px }
  button:focus-visible, a:focus-visible, #card:focus-visible{ outline-color:var(--ink) }   /* 白底的卡片、按鈕外框落在淺灰海面上，白框看不到（11-27） */
  .cty:focus-visible, .isle:focus-visible{ outline:none }
  @media (hover:hover) and (pointer:fine){
    .cty:hover{ opacity:.86 } .isle:hover svg{ background:var(--btn-2) } button:hover, html:not(.home) footer button:hover{ background:var(--btn-2) }
  }

  /* 橫式（框比 1:1 寬）：資訊卡在右側 */
  @media (min-aspect-ratio:1/1){
    h1{ font-size:24px } .ttl img{ height:22px }
    .cardpos{ left:auto; right:16px; width:300px; top:56px; bottom:44px; display:flex; align-items:center }
    .card{ width:100%; max-height:100% }
  }
  @media (min-aspect-ratio:1/1) and (max-width:620px){
    .ttl{ padding:7px 12px } h1{ font-size:19px } .ttl img{ height:16px } .legend{ font-size:12px; gap:3px 9px; padding:5px 12px 6px }
    /* 卡片 260px、每位候選人一列：11-18 起每個縣市都有環境金句，原本 230px 把姓名與票數拆兩列，金句被切在卡片外 */
    .cardpos{ width:260px; right:12px }
    .card{ padding:9px 12px } .card h2{ font-size:15px } .card ol{ margin-top:7px }
    .card li{ font-size:12.5px; column-gap:6px; grid-template-columns:18px minmax(0,1fr) auto 4.4em }
    .bd{ width:18px; height:18px; font-size:11.5px; border-radius:4px }
    .live{ font-size:11px; margin-left:6px } .stamp{ margin-left:4px } .tag{ font-size:11px; padding:1px 8px } .tgl{ font-size:11px; padding:1px 0 } .card .tg{ margin-top:3px; row-gap:2px }   /* 加了「環境政見：」，臺北的標籤換成兩行，528×352 卡片多 2px，收緊行距吃回來 */
    .isle, .isle svg{ width:84px } .isle svg{ height:74px } .isle[data-code="09020"] svg{ height:46px }
  }
  @media (prefers-reduced-motion:reduce){ button{ transition:none } }
  /* 首頁版才用的東西，文章版一律不顯示：按鈕圖示、放大鈕、右欄、卡片的「另有幾位候選人」、圖例的縣市數、資料時間 */
  .ic, #full, .side, .card .more, .legend .n, .dtime{ display:none }

  /* ── 首頁版（build_map.py --home，<html class="home">）：首頁「關鍵圖表」的 16:9 框（SPEC「首頁版」）──
     沒有標題、logo、最下面那行；左邊整塊是地圖，右欄（白底）由上而下放圖示按鈕、圖例、資訊卡。
     圖例、按鈕、卡片由 JS 搬進右欄（同一份 DOM，文章版不動） */
  .home{ --side:clamp(176px, 54vw, 320px); --pad:12px }
  .home header, .home footer{ display:none }
  /* 出處放在地圖右下角的小字（11-27 改，原本只寫在關鍵圖表的描述欄）：不墊底色，疊到陸地時靠跟海面同色的光暈看得清楚；窄框在分號後換行 */
  .hsrc{ display:none }
  .home .hsrc{ display:block; position:absolute; right:calc(var(--side) + 6px); bottom:4px; z-index:3; margin:0; max-width:calc(100% - var(--side) - 12px);
    font-size:11px; line-height:1.35; color:var(--mute); text-align:right; pointer-events:none; text-shadow:0 0 2px var(--sea), 0 0 2px var(--sea), 0 0 3px var(--sea) }
  .home .hsrc span{ display:inline-block; white-space:nowrap } .home .hsrc a{ color:inherit; text-decoration:none; pointer-events:auto }
  .home .mapwin{ right:var(--side) }
  .home .side{ display:flex; flex-direction:column; gap:10px; position:absolute; top:0; right:0; bottom:0; width:var(--side); box-sizing:border-box;
    padding:var(--pad); background:var(--frame); z-index:4 }
  /* 按鈕在右上、圖例在左；放不下（手機）就按鈕一列、圖例接在下面。按鈕的位置在全景與出卡之間不動 */
  .home .top{ display:flex; flex-direction:row-reverse; justify-content:space-between; align-items:flex-start; gap:8px }
  .home .legend{ display:flex; flex-direction:column; flex-wrap:nowrap; gap:3px; padding:2px 0 0; font-size:13px; min-width:9.5em }
  .home .legend .n{ display:inline; margin-left:auto; padding-left:10px; font-weight:700; font-variant-numeric:tabular-nums }
  .home .legend .lgh{ display:block; margin-bottom:2px; font-weight:700; line-height:1.3; color:var(--body) }   /* 圖例的小標題，字跟下面各列一樣大（11-27 起；手機框改排到右下角，見下面窄框那段） */
  .home .btns{ gap:6px }
  .home .ic{ display:block; width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round }
  .home .bt{ display:none }
  .home .btns button, .home #full{ display:grid; place-items:center; width:32px; height:32px; min-height:0; padding:0; border-radius:50%; color:var(--ink); background:var(--btn) }
  .home #full{ text-decoration:none; touch-action:manipulation; transition:transform 120ms var(--ease-out), background-color 120ms ease }
  .home #full:active{ transform:scale(.97); background:var(--btn-3) }
  #pause .play, #pause.on .bars, #full.on .open, #full .shut{ display:none } #pause.on .play, #full.on .shut{ display:inline }
  .home .side :focus-visible{ outline-color:var(--ink) }   /* 白底上白色焦點框看不到 */
  /* 卡片就是右欄的內容：不浮、不加陰影與內距，太長在卡片裡捲 */
  .home .cardpos{ position:relative; inset:auto; width:auto; flex:1 1 0; min-height:0; display:flex; flex-direction:column; align-items:stretch; z-index:auto }
  .home .card{ flex:0 1 auto; min-height:0; max-height:none; width:auto; padding:10px 0 0; border-top:1px solid var(--rule); border-radius:0; background:none; box-shadow:none }
  .home .card.measure{ display:none }
  /* 即時更新（SPEC「首頁版即時更新」）：圖例下面一行資料時間，自動更新中斷時變紅；已開所數由 JS 跟票數一起滾；
     開票中標示的圓點輕輕閃。減少動態時圓點不動、數字直接換 */
  .home .dtime{ display:block; margin:0; font-size:11px; line-height:1.3; color:var(--mute); font-variant-numeric:tabular-nums }
  .home .dtime[hidden]{ display:none }
  .home.stale .dtime{ color:#c0392b } [data-theme="night"].home.stale .dtime{ color:#ff6b5e }
  .home .sn{ font-variant-numeric:tabular-nums; white-space:nowrap }
  @keyframes pulse{ 50%{ opacity:.3 } }
  .home .live i{ animation:pulse 2s ease-in-out infinite }
  @media (prefers-reduced-motion:reduce){ .home .live i{ animation:none } }
  @media (hover:hover) and (pointer:fine){ .home #full:hover{ background:var(--btn-2) } }
  @media (max-width:620px){
    .home{ --pad:8px }
    .home .top{ flex-direction:column; align-items:stretch; gap:6px }
    .home .btns{ align-self:flex-end; gap:5px }
    .home .btns button, .home #full{ width:28px; height:28px } .home .ic{ width:14px; height:14px }
    .home .legend{ font-size:12px; gap:1px } .home .hsrc{ font-size:9px; line-height:1.3 }
    /* 手機框的出處：改放整張圖的右下角、一行更小的字（11-27），右欄底部的小地圖與卡片往上讓出那一行；地圖取景不用再讓 */
    .home .hsrc{ right:var(--pad); bottom:2px; z-index:6; max-width:none; font-size:8px; line-height:1.25; white-space:nowrap; text-shadow:0 0 2px var(--frame), 0 0 2px var(--frame) }
    .home .side{ padding-bottom:calc(var(--pad) + 9px) }
    .home .side{ gap:6px }
    /* 窄框的圖例疊在按鈕下面、佔掉卡片的高：出卡時收起，讓卡片用右欄的高（顏色看卡片的徽章），全景時才出現 */
    .home .side:has(#card:not([hidden])) .legend{ display:none }
    /* 資料時間放在按鈕左邊的空位（不佔高度：底下還有卡片與小地圖），出卡時也看得到；過期的字（更新中斷）換到第二行 */
    .home .dtime{ position:absolute; top:var(--pad); left:var(--pad); width:calc(100% - 2 * var(--pad) - 100px); font-size:10px; line-height:1.3 }
    /* 金門、連江小地圖搬到右欄底部並排：窄框的地圖只有 170 到 280px 寬，放在地圖左上會壓到澎湖。小地圖只在全景出現，出卡時已經淡出
       （點金門、連江時鏡頭不動、小地圖留著，卡片量過碰不到）；top 由 layout() 寫在行內，這裡要蓋掉 */
    .home .isles{ top:auto !important; bottom:calc(var(--pad) + 9px); left:calc(100% - var(--side) + var(--pad)); flex-direction:row; align-items:flex-end; gap:8px; z-index:5 }
    .home .isle, .home .isle svg{ width:54px } .home .isle svg{ height:44px } .home .isle[data-code="09020"] svg{ height:30px }
    .home .isle span{ font-size:10px; margin-top:2px }
  }
  /* 手機的 16:9 框（高 300 以下）：候選人放得下幾位就列幾位，放不下的寫還有幾位（JS 的 fitCard() 量） */
  @media (max-height:300px){
    .home .card{ padding-top:6px }
    .home .card h2{ font-size:14px } .home .card .st{ font-size:11px; margin-top:1px } .home .card ol{ margin-top:5px }
    .home .card li{ font-size:11.5px; line-height:1.4; column-gap:5px; grid-template-columns:16px minmax(0,1fr) auto auto }
    .home .card li + li{ margin-top:4px }
    .home .bd{ width:16px; height:16px; font-size:10.5px; border-radius:4px }
    .home .live{ font-size:10.5px; padding:0 6px 0 5px; margin-left:5px; vertical-align:1px }
    .home .tag, .home .tgl{ font-size:10.5px } .home .tag{ padding:1px 7px }
    .home .card .more{ display:block; margin:5px 0 0; font-size:11px; color:var(--mute) } .home .card .note{ font-size:11px; margin-top:4px }
  }
  /* 矮的手機框（360×203、390×219）：圖例下面多一行小字，全景時會碰到或貼著右欄底部的金門、連江小地圖，圖例行距收緊 */
  @media (max-width:620px) and (max-height:225px){ .home .legend{ line-height:1.15; gap:0 } }
  /* 電腦版整體字放大一級（11-27）：文章版的電腦尺寸（橫式、寬 700 以上）與首頁版的電腦框（寬 900 以上）；平板與手機不變 */
  @media (min-aspect-ratio:1/1) and (min-width:700px){
    html:not(.home) .legend{ font-size:15px } html:not(.home) .cardpos{ width:340px }
    html:not(.home) .card h2{ font-size:20px } html:not(.home) .card .st{ font-size:14.5px }
    html:not(.home) .card li{ font-size:16px; grid-template-columns:22px minmax(0,1fr) auto 4.4em } html:not(.home) .bd{ width:22px; height:22px; font-size:14px }
    html:not(.home) .live, html:not(.home) .tag, html:not(.home) .tgl, html:not(.home) .card .note{ font-size:13.5px }
    html:not(.home) button{ font-size:13.5px; min-height:36px } html:not(.home) .isle span{ font-size:12.5px }
  }
  @media (min-width:900px){
    .home{ --side:360px }
    .home .legend{ font-size:15px } .home .dtime{ font-size:13px } .home .hsrc{ font-size:12px }
    .home .card h2{ font-size:20px } .home .card .st{ font-size:14.5px }
    .home .card li{ font-size:16px; grid-template-columns:22px minmax(0,1fr) auto 4.4em } .home .bd{ width:22px; height:22px; font-size:14px }
    .home .live, .home .tag, .home .tgl, .home .card .note{ font-size:13.5px }
    .home .btns button, .home #full{ width:36px; height:36px } .home .ic{ width:18px; height:18px } .home .isle span{ font-size:12.5px }
  }
  /* 最矮的 360×203：底部多了出處那一行，金門、連江小地圖再縮一點，才不會碰到圖例 */
  @media (max-width:620px) and (max-height:210px){
    .home .isle, .home .isle svg{ width:46px } .home .isle svg{ height:36px } .home .isle[data-code="09020"] svg{ height:25px } .home .isle span{ font-size:9px }
  }
</style>
</head>
<body>
<div class="frame">
  <header>
    <div class="ttl"><h1>{{TITLE_H1}}</h1><img src="{{LOGO}}" alt="環境資訊中心"></div>
    <ul class="legend" aria-label="圖例">{{LEGEND}}</ul>
  </header>
  <div class="mapwin">
  <svg id="map" viewBox="0 0 8000 10000" role="group" aria-label="22 縣市當選地圖，可用 Tab 選縣市、Enter 看結果、Esc 回全台">
    <defs>
      <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6"><rect class="hp" width="6" height="6"/><rect class="hl" width="1.3" height="6"/></pattern>
      <pattern id="hatchI" patternUnits="userSpaceOnUse" width="6" height="6"><rect class="hp" width="6" height="6"/><rect class="hl" width="1.3" height="6"/></pattern>
      <pattern id="hatchH" patternUnits="userSpaceOnUse" width="6" height="6"><rect class="hp" width="6" height="6"/><rect class="hl" width="1.3" height="6"/></pattern>
      {{DEFS}}
    </defs>
    <g id="counties">{{PATHS}}</g>
    <!-- 浮起的板子：sh 接觸影（往下錯開）、sk 側面（原位）、lc 板面（抬高）、ol 外緣；路徑由 JS 從縣市複製 d -->
    <g id="lift"><path id="cv" d=""/><path id="sh" d=""/><path id="sk" d=""/><g id="lt"><path id="lc" d=""/><path id="ol" d=""/></g></g>
    <path id="fo" d=""/>
    <g id="hits">{{HITS}}</g>
  </svg>
  </div>
  <div class="isles">{{ISLES}}</div>
  <div class="cardpos">
    <section class="card" id="card" tabindex="0" aria-label="縣市結果" hidden><div class="in"></div></section>
    <div class="card measure" aria-hidden="true"><div class="in"></div></div>
  </div>
  <p class="hsrc"><span>資料來源：中央選舉委員會；</span><span><a href="https://data.gov.tw/license" target="_blank" rel="noopener">縣市界：內政部國土測繪中心</a></span></p>
  <footer>
    <!-- 出處、縣市界（授權）、製圖與免責聲明寫在文章嵌入區塊的說明欄（11-27），這裡只留開票狀態與資料時間 -->
    <p class="src"><span>{{SRC}}</span></p>
    <!-- 圖示只在首頁版顯示（首頁版的字藏起來，名稱靠 aria-label）；放大鈕連到文章版，JS 在能全螢幕的橫螢幕上改成全螢幕 -->
    <div class="btns"><button id="home" type="button" aria-hidden="true" tabindex="-1" aria-label="回全台" title="回全台"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M2.5 7.5L8 2.5l5.5 5M4 6.5V13.5h3v-3.5h2v3.5h3V6.5"/></svg><span class="bt">回全台</span></button><button id="pause" type="button" aria-label="暫停輪播" title="暫停輪播"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><g class="bars"><path d="M5.5 3.5v9M10.5 3.5v9"/></g><g class="play"><path d="M5 3l8 5-8 5z"/></g></svg><span class="bt">暫停輪播</span></button><a id="full" href="{{FULL}}" target="_blank" rel="noopener" aria-label="放大看完整版" title="放大看完整版"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><g class="open"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></g><g class="shut"><path d="M6 2.5V6H2.5M13.5 6H10V2.5M10 13.5V10h3.5M2.5 10H6v3.5"/></g></svg></a></div>
  </footer>
  <div class="side"><div class="top"></div><p class="dtime" hidden></p></div>
  <table class="sr"><caption>{{TITLE}}，各縣市前兩名</caption><tbody>{{TABLE}}</tbody></table>
</div>
<script>
"use strict";
if (!Array.prototype.at) Array.prototype.at = function (i) { i = Math.trunc(i) || 0; return this[i < 0 ? this.length + i : i]; };   // iOS 15.3 以前沒有 .at()，第一幀就丟錯、整張圖不動（11-27）
const D = {{DATA}};
const $ = s => document.querySelector(s);
const frame = $(".frame"), svg = $("#map"), card = $("#card"), cardIn = card.firstElementChild, measure = $(".card.measure .in");
const hatch = $("#hatch"), hatchH = $("#hatchH"), hatchI = $("#hatchI"), ol = $("#ol"), fo = $("#fo"), isles = $(".isles"), homeBtn = $("#home"), pauseBtn = $("#pause");
const lt = $("#lt"), lc = $("#lc"), sh = $("#sh"), sk = $("#sk"), cv = $("#cv"), liftG = $("#lift"), mapwin = $(".mapwin");
// 縣市路徑的 d（outer＝外緣只框自己，新北不框到臺北）；浮起、外緣、焦點都複製 d，不用 <use>
// p 是本島（澎湖是整個縣、標 isl），i 是外海小島（11-18 拆開：離島不畫白邊）
const $id = id => document.getElementById(id);
const dOf = (code, outer) => !code ? "" : outer && $id("o" + code) ? $id("o" + code).getAttribute("d")
  : $id("p" + code).getAttribute("d") + ($id("i" + code)?.getAttribute("d") || "");
const dOl = code => $id("p" + code).classList.contains("isl") ? "" : $id("p" + code).getAttribute("d");   // 白色外框只框本島，澎湖不框
const C = Object.fromEntries(D.counties.map(c => [c.code, c]));
const SIX = D.six, ISLE = new Set(D.isles);
const RM = matchMedia("(prefers-reduced-motion: reduce)");
const DEV = new URLSearchParams(location.search).has("dev");
// 首頁版：按鈕、圖例、資訊卡搬進右欄；版面一律是橫式（地圖在左）
const HOME = document.documentElement.classList.contains("home");
if (HOME) { const side = $(".side"); side.firstElementChild.append($(".btns"), $(".legend")); side.append($(".cardpos")); }

// ── 資訊卡內容 ──
const fmt = n => n.toLocaleString("en-US");
const opened = c => c.stations && c.stations.total ? 100 * c.stations.reported / c.stations.total : 0;   // 已開幾成（%）
function statusLine(c) {
  const t = c.stations ? `已開 ${fmt(c.stations.reported)}／${fmt(c.stations.total)} 所，` : "";
  // 首頁版：所數包在 .sn 裡，新資料到時跟票數一起滾（11-27 拿掉進度條，只留文字）
  const s = !t ? "" : HOME ? `已開 <span class="sn">${fmt(c.stations.reported)}／${fmt(c.stations.total)} 所</span>，${c.updated}` : t + c.updated;
  // counting、called 的標題旁有「開票中」標示，這行只寫票所與時間；called 的當選由姓名旁的印章表示
  return { counting: s, called: s, postponed: "選舉延後", pending: D.date.slice(5).replace("-", "/") + " 開票後更新" }[c.status] || "";
}
// 投票印章：圓圈裡一個「卜」字形；螢幕報讀照念「當選」
const STAMP = '<svg class="stamp" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><path d="M10.5 2.11V21.89M10.5 10.6L21.34 15.58"/></svg><span class="sr">當選</span>';
function cardHTML(c) {
  const st = statusLine(c), live = c.status === "counting" || c.status === "called";
  let h = `<h2>${c.name}${live ? '<span class="live"><i aria-hidden="true"></i>開票中</span>' : ""}</h2>` + (st ? `<p class="st">${st}</p>` : "");
  // 未開票也列候選人與政黨、不印票數（11-28：開票前整張卡只有一行字，圖看起來是空的）；開票後照常印票數
  if (c.cands.length && c.status !== "postponed") h += "<ol>" + c.cands.map(p =>
    `<li${p.elected ? ' class="win"' : ""}><i class="bd b-${p.group}" aria-hidden="true">${p.badge}</i><span class="nm"><b>${p.name}</b>${p.elected ? STAMP : ""}<span class="sr">（${p.party}）</span></span>` +
    (c.status === "pending" ? "" : `<span class="v">${fmt(p.votes)}</span><span class="pc">${p.pct.toFixed(2)}%</span>`) +
    (p.elected && c.tags ? `<span class="tg"><span class="tgl">環境政見：</span>${c.tags.map(g => `<span class="tag t-${g.k}">${g.t}</span>`).join('<span class="sr">、</span>')}</span>` : "") + "</li>").join("") + "</ol>" +
    (c.cands.length > 2 ? `<p class="more">另有 ${c.cands.length - 2} 位候選人</p>` : "");   // 首頁版手機框放不下全部時才顯示，人數由 fitCard() 改
  if (c.note) h += `<p class="note">${c.note}</p>`;
  return h;
}
const HTML = Object.fromEntries(D.counties.map(c => [c.code, cardHTML(c)]));
// 小地圖浮起的影子：在原位複製一份島的路徑，點到時才顯示（複製 d、不用 <use>：WebKit 會把原路徑的樣式帶進 <use> 的複本）
isles.querySelectorAll(".isle svg").forEach(s => { const sd = s.querySelector(".lf path").cloneNode(); sd.setAttribute("class", "sd"); s.insertBefore(sd, s.firstChild); });

// ── 曲線 ──
function bezier(x1, y1, x2, y2) {
  const f = (u, a, b) => 3 * (1 - u) * (1 - u) * u * a + 3 * (1 - u) * u * u * b + u * u * u;
  return t => { if (t <= 0) return 0; if (t >= 1) return 1; let lo = 0, hi = 1, u = t;
    for (let i = 0; i < 24; i++) { u = (lo + hi) / 2; if (f(u, x1, x2) < t) lo = u; else hi = u; } return f(u, y1, y2); };
}
const easeOut = bezier(0.23, 1, 0.32, 1);
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;   // easeInOutQuad，跟東京短影音一樣
const easeInv = v => v < .5 ? Math.sqrt(v / 2) : 1 - Math.sqrt((1 - v) / 2);   // 鏡頭走到幾成是在第幾成時間
const clamp = v => Math.min(1, Math.max(0, v));

// ── 傾斜（2.5D）：拉近出卡時地圖往後倒一點，全景是平的。鏡頭的 t 是傾斜的幾成（0 平、1 最斜） ──
const TILT_DEG = 16, LIFT = 5, SH_OFF = 2, UP = 260, DOWN = 180;   // 浮起：板面抬 5px、接觸影再往下 2px；抬起 260ms、放下 180ms
let TILT = 0, O = { x: 0, y: 0, p: 1, ml: 0, mr: 0, mt: 0 };   // O：傾斜的軸心（框內座標）、透視距離、SVG 往外多長的邊
function proj(px, py, t) {   // 框內平面座標 → 傾斜後的螢幕座標（CSS perspective(p) rotateX(t·TILT)，軸心 O）
  if (!t || !TILT) return [px, py];
  const a = t * TILT, dy = py - O.y, s = O.p / (O.p - dy * Math.sin(a));
  return [O.x + (px - O.x) * s, O.y + dy * Math.cos(a) * s];
}
function unproj(X, Y, a = TILT) {   // 反算：傾斜 a 時螢幕上的點原本在平面哪裡（預設最斜，量 SVG 要多大；觸控縮放換算手指位置）
  if (!a) return [X, Y];
  const yd = Y - O.y, dy = yd * O.p / (O.p * Math.cos(a) + yd * Math.sin(a)), s = O.p / (O.p - dy * Math.sin(a));
  return [O.x + (X - O.x) / s, O.y + dy];
}

// ── 版面：量標題、出處、每張資訊卡，算每個縣市的鏡頭 ──
let W, H, cams = {}, tour = null, smallHits = [];
function fit(bb, R, pad, t, kmax = Infinity, kmin = 0) {   // 把縣市外框（傾斜後的梯形外框）塞進 R、四周留 pad；縮放夾在 kmin 到 kmax
  const tw = (R.r - R.l) * (1 - 2 * pad), th = (R.b - R.t) * (1 - 2 * pad), rx = (R.l + R.r) / 2, ry = (R.t + R.b) / 2;
  let x = (bb[0] + bb[2]) / 2, y = (bb[1] + bb[3]) / 2, k = Math.max(kmin, Math.min(tw / (bb[2] - bb[0]), th / (bb[3] - bb[1]), kmax));
  const box = () => { const p = [[bb[0], bb[1]], [bb[2], bb[1]], [bb[0], bb[3]], [bb[2], bb[3]]].map(([mx, my]) => proj(W / 2 + (mx - x) * k, H / 2 + (my - y) * k, t));
    const X = p.map(q => q[0]), Y = p.map(q => q[1]); return [Math.min(...X), Math.min(...Y), Math.max(...X), Math.max(...Y)]; };

        if (n.poll_s === 0) LIVE.stopped = true;
        else if (n.poll_s > 0) LIVE.every = n.poll_s * 1000;
      } else if (why !== "seq") LIVE.rejected.push(why);
    } catch (e) { LIVE.fails++; }
  }
  LIVE.busy = false;
  stale();
  clearTimeout(LIVE.timer);
  // 失敗就拉長，最多 5 倍、但不超過 2 分鐘或一般間隔：減量的 5 分鐘輪詢失敗一次，不會拖到 10 分鐘以上（11-27）
  if (!LIVE.stopped) LIVE.timer = setTimeout(poll, Math.min(LIVE.every * Math.min(5, 1 + LIVE.fails), Math.max(LIVE.every, 120000)) * (0.9 + Math.random() * 0.2));
}
function applyLive(n) {   // 原地換掉每縣的資料物件（輪播、點擊、小地圖拿的是同一批物件），再換顏色、報讀文字、圖例、出處、表格
  const from = {}, pct = c => (c.status === "counting" || c.status === "called") && c.stations ? opened(c) : null;
  n.counties.forEach(cardHTML);   // 先把每張卡片試算一次：哪一縣的資料壞了就在這裡丟錯，還沒改到任何東西
  for (const c of n.counties) {
    const o = C[c.code], bbox = o.bbox;
    const f = { c: Object.fromEntries(o.cands.map(p => [p.name, [p.votes, p.pct]])), s: pct(o) ?? 0, r: pct(o) == null ? 0 : o.stations.reported };
    if (JSON.stringify(o.cands.map(p => [p.name, p.votes, p.pct])) !== JSON.stringify(c.cands.map(p => [p.name, p.votes, p.pct])) || pct(o) !== pct(c)) from[c.code] = f;
    for (const k of Object.keys(o)) delete o[k];
    Object.assign(o, c, { bbox });
    HTML[c.code] = cardHTML(o);
  }
  document.querySelectorAll("#counties .cty").forEach(g => { const c = C[g.dataset.code];
    g.setAttribute("class", `cty g-${c.group}`); g.setAttribute("aria-label", n.aria[c.code] || c.name); });
  document.querySelectorAll(".isle").forEach(el => { const c = C[el.dataset.code], p = el.querySelector(".lf path");
    el.setAttribute("aria-label", n.aria[c.code] || c.name); p.setAttribute("class", `g-${c.group}`);
    p.style.fill = c.group === "pend" ? "url(#hatchI)" : "";   // layout() 寫過行內斜線，換色時要清掉，不然開完了還是斜線
  });
  const set = (sel, h) => { const el = $(sel); if (el) el.innerHTML = h; };
  set(".legend", n.legend_home); set(".src span", n.src); set("table.sr tbody", n.table);
  D.dtime = n.dtime; LIVE.pub = (n.published_at || 0) * 1000; LIVE.applied++;
  fullBtn.href = fullBtn.getAttribute("href").split("?")[0] + "?v=" + n.seq;   // 手機另開的文章版是靜態檔：每版換網址，不吃 10 分鐘的快取（11-27）
  if (Object.keys(from).length) ANIM = { t0: performance.now(), from };
  shown = undefined; liftCode = null; liftKey = "";   // 資訊卡與浮起的板子照新資料重畫（板面顏色在 liftCode 換時才設）
}
// 資訊卡的票數、得票率、已開所數從舊值走到新值，1.5 秒後停在真的數字；減少動態時直接換。兩次更新之間不內插、不外推
function countUp(now) {
  const u = RM.matches ? 1 : clamp((now - ANIM.t0) / 1500), e = easeOut(u), f = shown != null && ANIM.from[shown];
  if (f) {
    const c = C[shown], at = (a, b) => u >= 1 ? b : a + (b - a) * e;
    cardIn.querySelectorAll("li").forEach((li, i) => { const p = c.cands[i], o = p && (f.c[p.name] || [0, 0]), v = li.querySelector(".v"), pc = li.querySelector(".pc");
      if (!p || !v || !pc) return;
      v.textContent = fmt(Math.round(at(o[0], p.votes))); pc.textContent = at(o[1], p.pct).toFixed(2) + "%"; });
    const sn = cardIn.querySelector(".sn");
    if (sn && c.stations) sn.textContent = `${fmt(Math.round(at(f.r, c.stations.reported)))}／${fmt(c.stations.total)} 所`;
  }
  if (u >= 1) ANIM = null;
}
function stale(first) {   // 開票開始後、還沒全部開完，迴圈超過 20 分鐘沒發新版：資料時間那行變紅、加「更新中斷」（手機框只放得下這麼短）
  const all = D.counties.every(c => c.status === "final" || c.status === "postponed"), begun = D.counties.some(c => c.status !== "pending" && c.status !== "postponed");
  const late = !first && !LIVE.stopped && begun && !all && LIVE.pub > 0 && Date.now() - LIVE.pub > (window.__STALE_MS || 20 * 60000);
  document.documentElement.classList.toggle("stale", late);
  const t = late ? (D.dtime || "") + "（更新中斷）" : D.dtime;
  if (dtimeEl.textContent !== t) dtimeEl.textContent = t;
  dtimeEl.hidden = !t;
}
if (HOME) {
  const polling = LIVE.epoch && !LIVE.stopped && !/[?&]nolive\b/.test(location.search);
  // 會輪詢就等第一次抓完再判過期：頁面可能是 CDN 快取了 10 分鐘的舊版，一打開就判會先閃一下「更新中斷」（11-27）
  stale(polling);
  if (polling) {
    if (window.__POLL_MS) LIVE.every = window.__POLL_MS;   // 測試用：縮短輪詢
    LIVE.timer = setTimeout(poll, 1000 + Math.random() * 2000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden && !LIVE.stopped) poll(); });
    setInterval(stale, 30000);   // 沒有新檔進來，過期也要自己出現
  }
  window.__live = LIVE;
}

if (DEV) {   // 開發用：?dev 才有，逐幀錄影與截圖用
  window.__tour = {
    get cycle() { return tour.cycle; }, get segs() { return tour.S.map(s => ({ t0: s.t0, dur: s.dur, dip: s.dip, card: s.ev.length ? s.ev.at(-1)[1] : s.cardFrom })); },
    seek(ms) { frozen = true; mode = "tour"; tourT = ((ms % tour.cycle) + tour.cycle) % tour.cycle; draw(performance.now()); },
  };
  window.__dev = { select(code) { frozen = true; go(code, true); draw(performance.now()); }, cams: () => cams };
}
</script>

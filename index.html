<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>環境資訊中心 互動地圖</title>
<style>
  :root {
    --ground: #F4F6F3; --surface: #FFFFFF;
    --ink: #17211D; --muted: #66766E; --line: #D8DED9; --accent: #2E6B57;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #121A17; --surface: #1A2420;
      --ink: #E7EDE9; --muted: #94A69D; --line: #2C3A34; --accent: #7CC0A4;
    }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--ground); color: var(--ink); margin: 0;
    padding: 56px 20px 80px; line-height: 1.7;
    font-family: -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  .shell { max-width: 640px; margin: 0 auto; }
  .eyebrow { font-size: 12px; letter-spacing: .16em; color: var(--accent); font-weight: 600; }
  h1 { font-size: 26px; margin: 6px 0 10px; letter-spacing: -0.01em; }
  .lede { color: var(--muted); margin: 0 0 32px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { border-top: 1px solid var(--line); }
  li:last-child { border-bottom: 1px solid var(--line); }
  li a {
    display: block; padding: 18px 4px; color: inherit; text-decoration: none;
  }
  li a:hover, li a:focus-visible { background: var(--surface); }
  li .name { font-weight: 600; color: var(--accent); }
  li .desc { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="shell">
  <div class="eyebrow">環境資訊中心</div>
  <h1>互動地圖</h1>
  <p class="lede">搭配報導使用的互動地圖。</p>

  <ul>
    <li>
      <a href="interactive-maps/tokyo/tokyo-bousai-map.html">
        <span class="name">東京・防災・生態 另類旅遊地圖 →</span>
        <span class="desc">六個防災與自然生態景點</span>
      </a>
    </li>
    <li>
      <a href="interactive-maps/demo-kaohsiung/kaohsiung-map.html">
        <span class="name">高雄示範地圖 →</span>
        <span class="desc">地圖產生器的示範</span>
      </a>
    </li>
  </ul>
</div>
</body>
</html>

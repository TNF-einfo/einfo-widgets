<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>環境資訊中心 互動地圖</title>
<style>
  :root {
    --ground: #F4F6F3; --surface: #FFFFFF;
    --ink: #17211D; --muted: #66766E; --line: #D8DED9; --accent: #2E6B57;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #121A17; --surface: #1A2420;
      --ink: #E7EDE9; --muted: #94A69D; --line: #2C3A34; --accent: #7CC0A4;
    }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--ground); color: var(--ink); margin: 0;
    padding: 56px 20px 80px; line-height: 1.7;
    font-family: -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  .shell { max-width: 640px; margin: 0 auto; }
  .eyebrow { font-size: 12px; letter-spacing: .16em; color: var(--accent); font-weight: 600; }
  h1 { font-size: 26px; margin: 6px 0 10px; letter-spacing: -0.01em; }
  .lede { color: var(--muted); margin: 0 0 32px; }

  .row {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 18px 4px; border-top: 1px solid var(--line);
  }
  .row:last-of-type { border-bottom: 1px solid var(--line); }
  .row > a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .row > a:hover, .row > a:focus-visible { text-decoration: underline; }
  .row .desc { color: var(--muted); font-size: 14px; flex: 1 1 auto; }
  .row .used { flex-basis: 100%; margin-top: -8px; font-size: 13px; color: var(--muted); }   /* 用了這張地圖的文章，發稿後補上 */
  .row .used a { color: var(--accent); }

  button.copy {
    font: inherit; font-size: 13px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 12px; cursor: pointer; white-space: nowrap;
  }
  button.copy:hover { border-color: var(--accent); color: var(--accent); }
  button.copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .said { font-size: 13px; color: var(--accent); }
</style>
</head>
<body>
<div class="shell">
  <div class="eyebrow">環境資訊中心</div>
  <h1>互動地圖</h1>
  <p class="lede">搭配報導使用的互動地圖。要嵌進文章，按「複製嵌入碼」貼進文章的原始碼區塊。</p>

  <div class="row">
    <a href="interactive-maps/tokyo-map-stable/tokyo-bousai-map.html">東京・防災・生態 另類旅遊地圖 →</a>
    <span class="desc">六個防災與自然生態景點</span>
    <button type="button" class="copy" data-title="東京・防災・生態 另類旅遊地圖">複製嵌入碼</button>
    <span class="used">使用的文章：<a href="https://www.e-info.org.tw/node/243698">互動地圖｜環資記者帶路 解鎖東京新玩法</a></span>
  </div>

  <div class="row">
    <a href="interactive-maps/tuvalu/tuvalu-map.html">吐瓦魯，富納富提 →</a>
    <span class="desc">長型衛星地圖、十二個地點，手機上往下捲著看</span>
    <button type="button" class="copy" data-title="吐瓦魯，富納富提" data-frame="height:1080px">複製嵌入碼</button>
    <span class="used">使用的文章：<a href="https://www.e-info.org.tw/feature/36">吐瓦魯：海浪帶不走的家</a>（手機版）</span>
  </div>

  <div class="row">
    <a href="interactive-maps/tuvalu/wide/tuvalu-map-wide.html">吐瓦魯，富納富提 橫版 →</a>
    <span class="desc">同一份內容轉 90 度排成橫幅，手機自動換成長型</span>
    <button type="button" class="copy" data-title="吐瓦魯，富納富提" data-frame="aspect-ratio:720/480"
            data-narrow="interactive-maps/tuvalu/tuvalu-map.html" data-narrow-frame="height:1080px">複製嵌入碼</button>
    <span class="used">使用的文章：<a href="https://www.e-info.org.tw/feature/36">吐瓦魯：海浪帶不走的家</a></span>
  </div>

  <div class="row">
    <a href="interactive-maps/tuvalu/coast/tuvalu-coast.html">吐瓦魯，富納富提 海岸線變化 →</a>
    <span class="desc">2022 到 2026 年五個時間點的衛星影像配字卡，看填海造陸怎麼改寫主島海岸。測試中，還不要拿去發稿</span>
    <button type="button" class="copy" data-title="吐瓦魯，富納富提 海岸線變化" data-frame="aspect-ratio:1/1" data-narrow-frame="aspect-ratio:2/3">複製嵌入碼</button>
  </div>

  <p class="said" id="said" role="status" aria-live="polite"></p>
</div>

<script>
(function () {
  "use strict";

  // 嵌入碼從同一列的連結現算，不另外寫一份網址（不會有兩處各自過期的問題）。
  //
  // 尺寸／比例照既有規劃，別自己改：max-width 720、aspect-ratio 720/476，
  // 外層 position:relative ＋ iframe 絕對定位填滿——這是實際發布文章用的那一套、
  // 已經在桌機 720／平板 528／手機 352.8 三個檔位實測過。地圖內部的斷點吃的是
  // **iframe 自身寬度**，所以別把它鎖成別的寬度，否則內層會挑錯檔位。
  function frame(url, title, box, margin) {
    return '<div style="max-width:720px;margin:' + margin + '">\n' +
           '  <div style="position:relative;' + box + '">\n' +
           '    <iframe src="' + url + '"\n' +
           '            title="' + title.replace(/"/g, '&quot;') + '" loading="lazy" allowfullscreen\n' +
           '            style="position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:16px">\n' +
           '    </iframe>\n' +
           '  </div>\n' +
           '</div>';
  }
  // 按鈕沒寫 data-frame＝東京那套（上面說的尺寸）。吐瓦魯的外框不同（見 interactive-maps/tuvalu/README.md「嵌入」）：
  // data-frame 是外框的尺寸（長型固定高度 height:1080px、橫版 aspect-ratio:720/480），最外層不留上下 margin
  // （owner 09-30：e-info 的嵌入框自己有 32px）；data-narrow 是畫面 700px 以下改嵌的那一版（橫版手機排不下，換回長型），
  // data-narrow-frame 是它的外框。兩版都寫進嵌入碼，用 CSS 只顯示一版；藏起來的 iframe 有 loading="lazy"，不會載入。
  // 同一張只換外框比例（data-narrow-frame、沒有 data-narrow，例：海岸線變化欄寬 600px 以下改 2:3）：用 container query 看欄寬、不看視窗寬，
  // 平板的 528 欄寬也會換。class 取自檔名，同一頁嵌兩張不同的也不會互相蓋掉樣式；不支援的舊瀏覽器一律用 data-frame。
  function sized(url, title, box, narrowBox) {
    var c = 'eic-' + url.split('/').pop().replace(/\.html$/, '').replace(/[^\w-]/g, '');
    return '<style>.' + c + '{container-type:inline-size;max-width:720px;margin:0 auto}.' + c + '>div{position:relative;' + box + '}' +
           '@container (max-width:600px){.' + c + '>div{' + narrowBox + '}}</style>\n' +
           '<div class="' + c + '">\n' +
           '  <div>\n' +
           '    <iframe src="' + url + '"\n' +
           '            title="' + title.replace(/"/g, '&quot;') + '" loading="lazy" allowfullscreen\n' +
           '            style="position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:16px">\n' +
           '    </iframe>\n' +
           '  </div>\n' +
           '</div>';
  }
  function snippet(url, title, d) {
    d = d || {};
    if (!d.frame) return frame(url, title, 'aspect-ratio:720/476', '32px auto');
    if (d.narrowFrame && !d.narrow) return sized(url, title, d.frame, d.narrowFrame);
    var main = frame(url, title, d.frame, '0 auto');
    if (!d.narrow) return main;
    return '<style>.tv-wide{display:block}.tv-tall{display:none}@media (max-width:700px){.tv-wide{display:none}.tv-tall{display:block}}</style>\n' +
           '<div class="tv-wide">\n' + main + '\n</div>\n' +
           '<div class="tv-tall">\n' + frame(new URL(d.narrow, location.href).href, title, d.narrowFrame, '0 auto') + '\n</div>';
  }

  var said = document.getElementById('said');
  var timer;
  function tell(msg) {
    said.textContent = msg;
    clearTimeout(timer);
    timer = setTimeout(function () { said.textContent = ''; }, 3000);
  }

  document.querySelectorAll('button.copy').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var link = btn.closest('.row').querySelector('a');
      var text = snippet(link.href, btn.dataset.title, btn.dataset);

      var manual = function () {
        // 剪貼簿被擋時的退路：放進一個暫時的 textarea 選起來，請人自己按 Ctrl+C
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;left:8px;bottom:8px;width:calc(100% - 16px);height:7em';
        document.body.appendChild(ta);
        ta.select();
        try {
          if (document.execCommand('copy')) { ta.remove(); tell('已複製'); return; }
        } catch (e) { /* 落到下面 */ }
        tell('已選取，請按 Ctrl+C（Mac 是 ⌘C）複製');
        ta.addEventListener('blur', function () { ta.remove(); });
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { tell('已複製'); }, manual);
      } else {
        manual();
      }
    });
  });

  // 自我檢查：嵌入碼壞了就在頁面上說，不要安靜地複製出壞東西
  var probe = snippet('https://example.org/m.html', 'a"b');
  if (probe.indexOf('src="https://example.org/m.html"') < 0 ||
      probe.indexOf('title="a&quot;b"') < 0 ||
      probe.indexOf('max-width:720px') < 0 ||          // 尺寸規則不可以漂掉
      probe.indexOf('aspect-ratio:720/476') < 0 ||
      probe.indexOf('position:absolute;inset:0') < 0 ||
      probe.indexOf('</iframe>') < 0) {
    said.textContent = '嵌入碼產生有問題，請先不要用，並告知維護者。';
  }
  var wide = snippet('https://example.org/w.html', 't', { frame: 'aspect-ratio:720/480', narrow: 'https://example.org/t.html', narrowFrame: 'height:1080px' });
  if (wide.indexOf('src="https://example.org/w.html"') < 0 || wide.indexOf('aspect-ratio:720/480') < 0 ||
      wide.indexOf('src="https://example.org/t.html"') < 0 || wide.indexOf('height:1080px') < 0 ||
      wide.indexOf('@media (max-width:700px)') < 0 || wide.indexOf('margin:0 auto') < 0 || wide.split('</iframe>').length !== 3) {
    said.textContent = '吐瓦魯的嵌入碼產生有問題，請先不要用，並告知維護者。';
  }
  var cq = snippet('https://example.org/x/c-d.html', 't', { frame: 'aspect-ratio:1/1', narrowFrame: 'aspect-ratio:2/3' });
  if (cq.indexOf('src="https://example.org/x/c-d.html"') < 0 || cq.indexOf('container-type:inline-size') < 0 ||
      cq.indexOf('.eic-c-d>div{position:relative;aspect-ratio:1/1}') < 0 || cq.indexOf('@container (max-width:600px){.eic-c-d>div{aspect-ratio:2/3}}') < 0 ||
      cq.indexOf('max-width:720px') < 0 || cq.split('</iframe>').length !== 2) {
    said.textContent = '海岸線變化的嵌入碼產生有問題，請先不要用，並告知維護者。';
  }
})();
</script>
</body>
</html>
